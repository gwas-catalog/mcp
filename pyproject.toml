[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gwas-mcp"
version = "1.0.4"
description = "GWAS Catalog Model Context Protocol (MCP) server"
authors = [
    { name = "Benjamin Wingfield", email = "bwingfield@ebi.ac.uk" },
]
license = "Apache-2.0"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]==2.1.1",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-prometheus>=0.50b0",
]

[project.scripts]
gwas-mcp = "gwascatalog.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gwascatalog"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "error",
]
markers = [
    "live: marks tests as live API tests (deselect with '-m not live')",
]

[tool.ruff.lint]
extend-select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "NPY",      # Some numpy-specific things
]

[tool.ruff.lint.per-file-ignores]
# pydantic models trigger a bunch of false positives
"src/gwascatalog/mcp/models/**/*.py" = ["TC001"]

[tool.ty.src]
include = ["src/gwascatalog"]

[tool.uv.workspace]
members = [
    "mcp-server-demo",
]


[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ty>=0.0.20",
]
